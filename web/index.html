<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="UniSphere">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="shortcut icon" href="favicon.ico">

  <title>UniSphere</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
    }
    .unisphere-preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      z-index: 999999;
      transition: opacity 0.4s ease-out;
    }
    .unisphere-preloader-gif {
      width: 96px;
      height: 96px;
      object-fit: contain;
      border-radius: 50%;
    }
    .unisphere-preloader-text {
      margin-top: 18px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #6366f1;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div id="unisphere-preloader" class="unisphere-preloader">
    <img class="unisphere-preloader-gif" src="tibsy-dp.gif" alt="UniSphere Loading..." />
    <div class="unisphere-preloader-text">Loading UniSphere...</div>
  </div>

  <script>
    window.addEventListener('load', function() {
      // Remove preloader once Flutter web app initializes
      var preloader = document.getElementById('unisphere-preloader');
      if (preloader) {
        setTimeout(function() {
          preloader.style.opacity = '0';
          setTimeout(function() {
            preloader.remove();
          }, 400);
        }, 300);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
